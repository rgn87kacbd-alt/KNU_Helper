       0. 드래그 바(Drag Handle) 크기 조절 로직

    const dragHandle = document.getElementById('dragHandle');
    const topSection = document.getElementById('topSection');
    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    function onDragStart(e) {
      isDragging = true;
      startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      startHeight = topSection.getBoundingClientRect().height;
      document.body.style.cursor = 'ns-resize';
    }

    function onDragMove(e) {
      if (!isDragging) return;
      const currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      const delta = currentY - startY;
      let newHeight = startHeight + delta;
      
      if (newHeight < 150) newHeight = 150;
      if (newHeight > window.innerHeight * 0.7) newHeight = window.innerHeight * 0.7;
      
      topSection.style.height = `${newHeight}px`;
    }

    function onDragEnd() {
      isDragging = false;
      document.body.style.cursor = 'default';
    }

    dragHandle.addEventListener('mousedown', onDragStart);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    
    dragHandle.addEventListener('touchstart', onDragStart, { passive: true });
    document.addEventListener('touchmove', onDragMove, { passive: false });

    /* -----------------------------------------------------------
       1-2. 전공 목록 & 전공 전환 (야간 전공 모두 제거)
       ----------------------------------------------------------- */
    const DEFAULT_MAJOR = '자유전공학부';
    const COMMON_CATEGORIES = ['균형교양'];

    const BASE_MAJORS = [
      '자유전공학부',
      'ICT융합공학부 (공과대학)',
      'Wel-Tech융합전공 (복지융합대학)',
      '가상현실전공 (ICT융합공학부)',
      '건축공학전공 (부동산건설학부)',
      '경영학전공 (글로벌경영학부)',
      '경영학전공 (상경학부)',
      '경제금융전공 (정경학부)',
      '경제금융학전공',
      '공공인재학전공 (정경학부)',
      '교양 (대학)'
    ];
    const MAJORS = Array.from(new Set([...BASE_MAJORS, ...(Array.isArray(window.EXTRA_MAJORS) ? window.EXTRA_MAJORS : [])]));
    if (Array.isArray(window.EXTRA_COURSES)) ALL_COURSES.push(...window.EXTRA_COURSES);

    let selectedMajor = DEFAULT_MAJOR;

    function parseMajor(label) {
      const idx = label.indexOf(' (');
      if (idx > 0 && label.endsWith(')')) return { name: label.slice(0, idx), group: label.slice(idx + 2, -1) };
      return { name: label, group: '' };
    }

    function courseInSelectedMajor(c) {
      if (COMMON_CATEGORIES.includes(c.deptCategory)) return true;
      return (c.major || DEFAULT_MAJOR) === selectedMajor;
    }

    function majorOwnCourseCount(label) {
      return ALL_COURSES.filter(c => !COMMON_CATEGORIES.includes(c.deptCategory) && (c.major || DEFAULT_MAJOR) === label).length;
    }

    function renderMajorList(query = '') {
      const box = document.getElementById('majorListContainer');
      const norm = (t) => t.replace(/\s+/g, '').toLowerCase();
      const q = norm(query);

      const groups = [];
      const groupMap = {};
      MAJORS.forEach((label, idx) => {
        if (q && !norm(label).includes(q)) return;
        const g = parseMajor(label).group || '소속 표기 없음';
        if (!groupMap[g]) { groupMap[g] = []; groups.push(g); }
        groupMap[g].push({ label, idx });
      });

      if (groups.length === 0) {
        box.innerHTML = '<div class="py-10 text-center text-slate-500 text-xs">검색 결과가 없습니다.</div>';
        return;
      }

      box.innerHTML = groups.map(g => {
        const rows = groupMap[g].map(({ label, idx }) => {
          const { name } = parseMajor(label);
          const count = majorOwnCourseCount(label);
          const isSel = label === selectedMajor;
          const badge = count > 0
            ? `<span class="text-[10px] font-bold text-sky-400">${count}개</span>`
            : `<span class="text-[10px] text-slate-500">준비 중</span>`;
          return `
            <button type="button" onclick="selectMajorByIndex(${idx})" class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-left transition ${isSel ? 'bg-[#1e2538] border border-blue-600/50' : 'bg-[#242426] border border-transparent hover:border-slate-600'}">
              <span class="text-[12px] font-bold text-white break-words min-w-0">${name}</span>
              <span class="flex items-center gap-2 shrink-0">${badge}${isSel ? '<i class="fa-solid fa-check text-sky-400 text-[11px]"></i>' : ''}</span>
            </button>`;
        }).join('');
        return `
          <div class="text-[10px] font-bold text-slate-500 px-1 pt-3 pb-1.5">${g}</div>
          <div class="flex flex-col gap-1.5">${rows}</div>`;
      }).join('');
    }

    function openMajorSheet() {
      const overlay = document.getElementById('majorSheetOverlay');
      const sheet = document.getElementById('majorSheet');
      document.getElementById('majorSearchInput').value = '';
      renderMajorList('');
      document.getElementById('majorListContainer').scrollTop = 0;

      overlay.classList.remove('hidden');
      void overlay.offsetWidth;
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100', 'pointer-events-auto');
      sheet.classList.remove('translate-y-full');
      sheet.classList.add('translate-y-0');
    }

    function closeMajorSheet() {
      const overlay = document.getElementById('majorSheetOverlay');
      const sheet = document.getElementById('majorSheet');
      overlay.classList.remove('opacity-100', 'pointer-events-auto');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      sheet.classList.remove('translate-y-0');
      sheet.classList.add('translate-y-full');
      setTimeout(() => overlay.classList.add('hidden'), 300);
    }

    function selectMajorByIndex(idx) {
      const label = MAJORS[idx];
      if (!label) return;
      selectedMajor = label;
      const el = document.getElementById('majorSelectLabel');
      el.textContent = label;
      document.getElementById('majorSelectBtn').title = label;
      closeMajorSheet();
      setCourseFilter('all', null);   // 카테고리 필터 초기화 + 목록 다시 그리기
    }

    /* -----------------------------------------------------------
       2. 애플리케이션 상태 (State)
       ----------------------------------------------------------- */
    const DAYS = ['월', '화', '수', '목', '금'];
    const PERIODS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    
    const PERIOD_TIMES = {
      1: '09:00-09:50',
      2: '09:50-10:50',
      3: '10:50-11:40',
      4: '11:50-12:40',
      5: '12:40-01:40',
      6: '01:40-02:30',
      7: '02:40-03:30',
      8: '03:30-04:30',
      9: '04:30-05:20'
    };

    let currentMode = 'browse';
    let selectedFilterCategory = 'all';
    let searchQuery = '';
    let planBPreference = 'vacation'; 
    let previewCourse = null;
    let targetPlanBCourseId = null; 

    // 초기 빈 시간표
    let enrolledCourseIds = [];

    function getEnrolledCourses() {
      return enrolledCourseIds.map(id => ALL_COURSES.find(c => c.id === id)).filter(Boolean);
    }

    function getTotalCredits() {
      return getEnrolledCourses().reduce((sum, c) => sum + (c.credits || 0), 0);
    }

    /* -----------------------------------------------------------
       3. 충돌 검사
       ----------------------------------------------------------- */
    function checkConflict(targetCourse, ignoreCourseId = null) {
      if (!targetCourse.dayPeriods || targetCourse.dayPeriods.length === 0) {
        return { hasConflict: false };
      }
      const activeList = getEnrolledCourses().filter(c => c.id !== ignoreCourseId);
      for (const enrolled of activeList) {
        if (!enrolled.dayPeriods || enrolled.dayPeriods.length === 0) continue;
        for (const tDp of targetCourse.dayPeriods) {
          for (const eDp of enrolled.dayPeriods) {
            if (tDp.day === eDp.day) {
              const overlap = tDp.periods.filter(p => eDp.periods.includes(p));
              if (overlap.length > 0) {
                return { hasConflict: true, with: enrolled.name, day: tDp.day, periods: overlap };
              }
            }
          }
        }
      }
      return { hasConflict: false };
    }

    /* -----------------------------------------------------------
       4. 모바일 시간표 렌더링 (줄바꿈 수정)
       ----------------------------------------------------------- */
    function renderTimetable() {
      const wrapper = document.getElementById('timetableGridWrapper');
      wrapper.innerHTML = '';

      const enrolled = getEnrolledCourses();
      const cellMap = {};
      const renderedSpan = {};

      DAYS.forEach(d => {
        cellMap[d] = {};
        renderedSpan[d] = {};
      });

      enrolled.forEach(c => {
        (c.dayPeriods || []).forEach(dp => {
          dp.periods.forEach(p => {
            if (p <= 9) cellMap[dp.day][p] = { course: c, isPreview: false };
          });
        });
      });

      if (currentMode === 'browse' && previewCourse) {
        (previewCourse.dayPeriods || []).forEach(dp => {
          dp.periods.forEach(p => {
            if (p <= 9 && !cellMap[dp.day][p]) {
              cellMap[dp.day][p] = { course: previewCourse, isPreview: true };
            }
          });
        });
      }

      PERIODS.forEach(p => {
        const pCell = document.createElement('div');
        pCell.className = 'tt-cell bg-[#18181a] border-b border-[#242426] flex flex-col items-center justify-center text-slate-400 font-bold px-1 py-0.5 gap-0.5';
        
        const timeParts = PERIOD_TIMES[p].split('-');
        pCell.innerHTML = `
          <span class="text-[11px] font-extrabold text-slate-300 leading-none">${timeParts[0]}</span>
          <span class="text-[9px] font-medium text-slate-500 leading-none">${timeParts[1]}</span>
        `;
        wrapper.appendChild(pCell);

        DAYS.forEach(day => {
          if (renderedSpan[day][p]) return;

          const slot = cellMap[day][p];
          const cell = document.createElement('div');
          cell.className = 'tt-cell border-b border-[#242426] p-[2px] relative flex flex-col justify-start';

          if (slot) {
            const c = slot.course;
            const dp = c.dayPeriods.find(d => d.day === day);
            const consecutive = dp ? dp.periods.filter(period => period >= p) : [p];

            let span = 1;
            for (let i = 1; i < consecutive.length; i++) {
              if (consecutive[i] === p + i) span++;
              else break;
            }

            if (span > 1) {
              cell.style.height = `${span * 48}px`;
              cell.style.gridRow = `span ${span}`;
              for (let s = 1; s < span; s++) renderedSpan[day][p + s] = true;
            }
            renderedSpan[day][p] = true;

            const isPreview = slot.isPreview;
            const block = document.createElement('div');
            block.className = `w-full h-full rounded-md p-1.5 flex flex-col justify-start leading-tight overflow-hidden text-left transition shadow-sm ${
              isPreview ? 'border-2 border-dashed border-amber-400 opacity-90' : 'border border-black/10'
            }`;
            block.style.backgroundColor = isPreview ? '#422006' : (c.color || '#3b82f6');
            block.style.color = '#ffffff';

            // 줄바꿈 허용 (line-clamp-2, break-words) 및 하단 정보 여백 조정
            block.innerHTML = `
              <div class="font-extrabold text-[11px] line-clamp-2 break-words leading-snug">${c.name}</div>
              <div class="flex flex-col mt-auto items-start w-full overflow-hidden">
                <span class="text-[9px] font-bold opacity-90 w-full truncate">${c.prof}</span>
                ${c.room ? `<span class="text-[9px] opacity-80 mt-[1px] w-full truncate">${c.room}</span>` : ''}
              </div>
            `;
            cell.appendChild(block);
          } else {
            cell.className += ' bg-[#121212]/50';
          }
          wrapper.appendChild(cell);
        });
      });

      updateCreditHeader();
    }

    function updateCreditHeader() {
      const credits = getTotalCredits();
      const badge = document.getElementById('creditTotalBadge');
      const msg = document.getElementById('creditStatusMsg');

      badge.textContent = `${credits} / 19`;
      if (credits < 12) {
        msg.textContent = `(최소 12학점 미달: ${12 - credits}학점 필요)`;
        msg.className = 'text-[10px] text-amber-400 font-medium';
      } else if (credits > 19) {
        msg.textContent = `(19학점 초과 불가)`;
        msg.className = 'text-[10px] text-rose-500 font-bold';
      } else {
        msg.textContent = `(정상 범위 충족)`;
        msg.className = 'text-[10px] text-emerald-400 font-medium';
      }
    }

    /* -----------------------------------------------------------
       5. 리스트 렌더링
       ----------------------------------------------------------- */
    function renderCourseList() {
      const container = document.getElementById('courseListContainer');
      container.innerHTML = '';

      const q = searchQuery.toLowerCase().trim();
      const filtered = ALL_COURSES.filter(c => {
        if (!courseInSelectedMajor(c)) return false;

          if (selectedFilterCategory.includes('균형')) {

            if (c.deptCategory !== '균형교양' || c.area.toString() !== num) return false;
          } else {
            if (c.deptCategory !== selectedFilterCategory) return false;

        if (q) {
          const matchName = c.name.toLowerCase().includes(q);

          if (!matchName && !matchProf && !matchCode) return false;
        }
        return true;

            <span class="text-[10px] text-slate-400">${creditStr}</span>
            <div class="flex items-center gap-1.5">
              ${renderCardActionButton(c, isEnrolled, conflict)}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCardActionButton(c, isEnrolled, conflict) {
      if (currentMode === 'browse') {
        if (!c.dayPeriods || c.dayPeriods.length === 0) {
          return `<span class="px-2.5 py-1 rounded-lg bg-[#242426] text-slate-500 text-[11px] font-medium">시간 미지정</span>`;
        }
        return `
          <button onclick="previewOnTimetable('${c.id}')" class="px-2.5 py-1 rounded-lg bg-[#2a2a2d] hover:bg-[#343438] text-slate-200 text-[11px] font-medium transition">미리보기</button>
        `;
      }

      if (isEnrolled) {
        if (c.isLocked) return `<span class="text-[10px] font-bold text-slate-500 px-2 py-1 bg-[#242426] rounded">고정 필수</span>`;
        
        let btns = '';
        if (c.deptCategory === '균형교양') {
          btns += `<button onclick="openPlanBModal('${c.id}')" class="px-2.5 py-1 rounded-lg bg-amber-600/20 text-amber-400 border border-amber-500/30 text-[11px] font-bold mr-1 flex items-center gap-1"><i class="fa-solid fa-bolt"></i> 대체 추천</button>`;
        }
        
        btns += `<button onclick="removeCourse('${c.id}')" class="px-2.5 py-1 rounded-lg bg-rose-600/20 text-rose-400 border border-rose-500/30 text-[11px] font-bold">취소</button>`;
        return btns;
      } else {
        if (conflict.hasConflict) {
          return `<button onclick="showToast('${conflict.with} 중복', 'error')" class="px-2.5 py-1 rounded-lg bg-red-950/40 text-red-400 border border-red-800/40 text-[11px] font-medium">시간 중복</button>`;
        }
        return `<button onclick="enrollCourse('${c.id}')" class="px-3 py-1 rounded-lg bg-[#e14436] hover:bg-[#c93b2f] text-white text-[11px] font-extrabold shadow-sm transition">시간표에 추가</button>`;
      }
    }

    /* -----------------------------------------------------------
       6. 인터랙션 및 필터 제어
       ----------------------------------------------------------- */
    function switchCategory(mode) {
      currentMode = mode;
      previewCourse = null;
      document.getElementById('tabBrowse').className = mode === 'browse' ? 'py-1.5 text-xs font-bold rounded-lg transition bg-[#3a3a3c] text-white shadow-sm' : 'py-1.5 text-xs font-medium rounded-lg transition text-slate-400 hover:text-white';
      document.getElementById('tabEnroll').className = mode === 'enroll' ? 'py-1.5 text-xs font-bold rounded-lg transition bg-[#3a3a3c] text-white shadow-sm' : 'py-1.5 text-xs font-medium rounded-lg transition text-slate-400 hover:text-white';
      document.getElementById('modeHelperTag').textContent = mode === 'browse' ? '개설 과목 둘러보기' : '수강신청';
      renderTimetable();
      renderCourseList();
    }

    function setCourseFilter(category, btnElement) {
      selectedFilterCategory = category;
      
      const gSelect = document.getElementById('gyunhyungSelectFilter');
      gSelect.value = 'none';
      gSelect.className = 'bg-[#262629] text-slate-300 border border-[#343438] rounded-full px-2.5 py-1 text-[11px] font-medium outline-none cursor-pointer shrink-0 transition';

      document.querySelectorAll('button.filter-chip').forEach(btn => {
        btn.className = 'filter-chip px-2.5 py-1 rounded-full text-[11px] font-medium bg-[#262629] text-slate-300 border border-[#343438] shrink-0 transition';
      });
      
      const activeClass = 'filter-chip active px-2.5 py-1 rounded-full text-[11px] font-bold bg-[#38bdf8]/10 text-[#38bdf8] border border-[#38bdf8]/50 shrink-0 transition';
      if (btnElement) {
        btnElement.className = activeClass;
      } else {
        document.getElementById('btnFilterAll').className = activeClass;
      }
      
      renderCourseList();
    }

    function setGyunhyungFilter(value) {
      const selectEl = document.getElementById('gyunhyungSelectFilter');
      if(value === 'none') {
        selectEl.className = 'bg-[#262629] text-slate-300 border border-[#343438] rounded-full px-2.5 py-1 text-[11px] font-medium outline-none cursor-pointer shrink-0 transition';
        setCourseFilter('all', document.getElementById('btnFilterAll'));
        return;
      }
      selectedFilterCategory = value;
      
      document.querySelectorAll('button.filter-chip').forEach(btn => {
        btn.className = 'filter-chip px-2.5 py-1 rounded-full text-[11px] font-medium bg-[#262629] text-slate-300 border border-[#343438] shrink-0 transition';
      });
      
      selectEl.className = 'bg-[#38bdf8]/10 text-[#38bdf8] border border-[#38bdf8]/50 rounded-full px-2.5 py-1 text-[11px] font-bold outline-none cursor-pointer shrink-0 transition';
      
      renderCourseList();
    }

    function previewOnTimetable(courseId) {
      const c = ALL_COURSES.find(item => item.id === courseId);
      if (!c) return;
      if (!c.dayPeriods || c.dayPeriods.length === 0) {
        showToast('지정된 강의 시간이 없는 과목입니다.', 'info');
        return;
      }
      if (previewCourse && previewCourse.id === c.id) {
        previewCourse = null;
        showToast('미리보기를 해제했습니다.', 'info');
      } else {
        previewCourse = c;
        showToast(`'${c.name}' 위치를 상단에 표시합니다.`, 'info');
      }
      renderTimetable();
    }

    function enrollCourse(courseId) {
      const course = ALL_COURSES.find(c => c.id === courseId);
      if (!course) return;
      if (getTotalCredits() + course.credits > 19) {
        showToast('19학점을 초과할 수 없습니다.', 'error');
        return;
      }
      const conflict = checkConflict(course);
      if (conflict.hasConflict) {
        showToast(`'${conflict.with}' 수업과 겹칩니다.`, 'error');
        return;
      }
      enrolledCourseIds.push(course.id);
      renderTimetable();
      renderCourseList();
      showToast(`'${course.name}' 추가 완료`, 'success');
    }

    function removeCourse(courseId) {
      const course = ALL_COURSES.find(c => c.id === courseId);
      if (!course || course.isLocked) return;
      enrolledCourseIds = enrolledCourseIds.filter(id => id !== courseId);
      renderTimetable();
      renderCourseList();
      showToast(`'${course.name}' 취소됨`, 'info');
    }

    /* -----------------------------------------------------------
       7. PLAN B 엔진 
       ----------------------------------------------------------- */
    function openPlanBModal(courseId = null) {
      if (!courseId) {
        const elective = getEnrolledCourses().find(c => c.deptCategory === '균형교양');
        if (elective) courseId = elective.id;
        else { showToast('선택된 균형교양이 없습니다.', 'error'); return; }
      }
      
      targetPlanBCourseId = courseId;
      const t = ALL_COURSES.find(c => c.id === courseId);
      document.getElementById('planBTargetTitle').innerHTML = `<span class="text-amber-400">${t.name}</span> 대체 강의 추천`;
      
      renderPlanBList();
      
      const overlay = document.getElementById('planBModalOverlay');
      const sheet = document.getElementById('planBModalSheet');
      
      overlay.classList.remove('hidden');
      void overlay.offsetWidth; 
      
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100', 'pointer-events-auto');
      
      sheet.classList.remove('translate-y-full');
      sheet.classList.add('translate-y-0');
    }

    function closePlanBModal() {
      const overlay = document.getElementById('planBModalOverlay');
      const sheet = document.getElementById('planBModalSheet');
      
      overlay.classList.remove('opacity-100', 'pointer-events-auto');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      
      sheet.classList.remove('translate-y-0');
      sheet.classList.add('translate-y-full');
      
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    function changePlanBPreference(pref) {
      planBPreference = pref;
      const v = document.getElementById('planBFilterVacation');
      const c = document.getElementById('planBFilterCompact');
      if (pref === 'vacation') {
        v.className = 'py-2 flex items-center justify-center gap-1.5 rounded-lg font-bold bg-[#2563eb] text-white border border-[#3b82f6] transition';
        c.className = 'py-2 flex items-center justify-center gap-1.5 rounded-lg font-medium text-slate-400 bg-transparent transition';
        document.getElementById('planBHelperText').innerHTML = '안내: 화·금 공강을 유지하고 기존 수업일에 스며드는 대체 균형교양을 추천합니다.';
      } else {
        c.className = 'py-2 flex items-center justify-center gap-1.5 rounded-lg font-bold bg-[#2563eb] text-white border border-[#3b82f6] transition';
        v.className = 'py-2 flex items-center justify-center gap-1.5 rounded-lg font-medium text-slate-400 bg-transparent transition';
        document.getElementById('planBHelperText').innerHTML = '안내: 우주공강을 막기 위해 오전 1~3교시 시작이나 연강 배치를 우선 추천합니다.';
      }
      renderPlanBList();
    }

    function renderPlanBList() {
      const container = document.getElementById('planBRecommendations');
      container.innerHTML = '';

      const candidates = ALL_COURSES.filter(c => {
        if (c.deptCategory !== '균형교양') return false;
        if (enrolledCourseIds.includes(c.id)) return false;
        const conflict = checkConflict(c, targetPlanBCourseId);
        return !conflict.hasConflict;
      });

      const scored = candidates.map(c => {
        let score = 0;
        let reasons = [];
        const days = c.dayPeriods.map(dp => dp.day);

        if (planBPreference === 'vacation') {
          if (!days.includes('화') && !days.includes('금')) { score += 50; reasons.push('화·금 공강 사수'); }
          if (days.includes('수')) { score += 20; reasons.push('기존 수업일 매칭'); }
          if (c.rating >= 4.5) { score += 15; reasons.push(`평점 ${c.rating.toFixed(1)}`); }
        } else {
          const periods = c.dayPeriods.flatMap(dp => dp.periods);
          if (periods.includes(1) || periods.includes(2) || periods.includes(3)) { score += 45; reasons.push('오전 1~3교시 시작'); }
          if (c.wishlist >= 50) { score += 20; reasons.push(`인기 (담은 ${c.wishlist}명)`); }
        }
        return { course: c, score, reasons };
      });

      scored.sort((a, b) => b.score - a.score);
      const topPicks = scored.slice(0, 5);

      if (topPicks.length === 0) {
        container.innerHTML = `<div class="py-8 text-center text-slate-500 text-xs">대체 가능한 교양 과목이 없습니다.</div>`;
        return;
      }

      topPicks.forEach((item, idx) => {
        const c = item.course;
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border flex flex-col gap-2.5 bg-white text-black`; 
        
        if (idx === 0) card.classList.add('border-amber-400', 'shadow-[0_0_10px_rgba(251,191,36,0.3)]', 'ring-1', 'ring-amber-400');
        else card.classList.add('border-slate-200');

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap mb-1">
                ${idx === 0 ? `<span class="bg-amber-400 text-white font-extrabold text-[10px] px-1.5 py-0.5 rounded-full shadow-sm">1순위 추천</span>` : `<span class="bg-slate-200 text-slate-600 font-bold text-[10px] px-1.5 py-0.5 rounded">${idx+1}순위</span>`}
                <span class="text-[10px] font-bold text-blue-600 border border-blue-200 bg-blue-50 px-1.5 py-0.5 rounded">${c.area}영역</span>
                <span class="text-sm font-extrabold text-slate-900">${c.name}</span>
                <span class="text-[11px] text-slate-500">${c.prof} 교수</span>
              </div>
              <div class="text-[11px] text-slate-500 mt-1 flex items-center gap-1.5 flex-wrap">
                <span class="font-medium"><i class="fa-regular fa-clock text-slate-400"></i> ${c.timeDisplay}</span>
                <span>•</span>
                <span><i class="fa-solid fa-location-dot text-slate-400"></i> ${c.room}</span>
                <span>•</span>
                <span class="text-amber-500 font-bold">★ ${c.rating.toFixed(1)}</span>
                <span>•</span>
                <span>담은 인원: ${c.wishlist}명</span>
              </div>
              <div class="flex items-center gap-1.5 mt-2 flex-wrap">
                ${item.reasons.map(r => `<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md border border-slate-200 text-slate-600 bg-slate-50 shadow-sm"><i class="fa-solid fa-check text-blue-500"></i> ${r}</span>`).join('')}
              </div>
            </div>
            
            <button onclick="applyPlanBCourse('${c.id}')" class="shrink-0 ml-3 px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md transition whitespace-nowrap">
              교체
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function applyPlanBCourse(newCourseId) {
      if (targetPlanBCourseId) {
        enrolledCourseIds = enrolledCourseIds.filter(id => id !== targetPlanBCourseId);
      }
      enrolledCourseIds.push(newCourseId);
      closePlanBModal();
      renderTimetable();
      renderCourseList();
      showToast('대체 과목으로 교체되었습니다.', 'success');
    }

    /* -----------------------------------------------------------
       8. 토스트 기능
       ----------------------------------------------------------- */
    let toastTimeout = null;
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const icon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      if (type === 'success') icon.className = 'fa-solid fa-circle-check text-emerald-400';
      else if (type === 'error') icon.className = 'fa-solid fa-circle-exclamation text-rose-400';
      else icon.className = 'fa-solid fa-circle-info text-blue-400';

      toast.classList.remove('opacity-0', 'pointer-events-none');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2500);
    }

    /* 필터 칩 바 좌우 이동 (마우스 드래그 + 휠). 터치는 기본 스와이프 사용 */
    function initChipBarScroll() {
      const bar = document.getElementById('filterChipContainer');
      if (!bar) return;

      // 마우스 휠(세로) → 가로 이동
      bar.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          bar.scrollLeft += e.deltaY;
          e.preventDefault();
        }
      }, { passive: false });

      // 마우스 드래그로 이동
      let isDown = false, moved = false, startX = 0, startLeft = 0;
      bar.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse' || e.button !== 0) return;
        if (e.target.closest('select')) return;
        isDown = true; moved = false;
        startX = e.clientX; startLeft = bar.scrollLeft;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isDown) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 5) { moved = true; bar.classList.add('is-dragging'); }
        if (moved) bar.scrollLeft = startLeft - dx;
      });
      window.addEventListener('pointerup', () => {
        isDown = false;
        bar.classList.remove('is-dragging');
      });
      // 드래그 직후에는 칩 클릭이 실행되지 않도록 차단
      bar.addEventListener('click', (e) => {
        if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
      }, true);
    }

    /* -----------------------------------------------------------
       9. 초기화 및 이벤트 등록
       ----------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      renderTimetable();
      initChipBarScroll();
      renderCourseList();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderCourseList();
      });

      document.getElementById('btnResetAll').addEventListener('click', () => {
        enrolledCourseIds = [];
        previewCourse = null;
        renderTimetable();
        renderCourseList();
        showToast('시간표가 완전히 비워졌습니다.', 'info');
      });
    });
  </script>
</body>
</html>
